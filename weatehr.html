<!DOCTYPE html>
<html>
<head>
    <title>Weather App</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eaf6ff;
            text-align: center;
            padding: 50px;
        }

        .box {
            background: white;
            width: 350px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 15px #ccc;
        }

        input {
            padding: 10px;
            width: 200px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            padding: 10px 15px;
            margin-left: 5px;
            border: none;
            border-radius: 5px;
            background: #2196f3;
            color: white;
            cursor: pointer;
        }

        #weather {
            margin-top: 25px;
        }

        .temperature {
            font-size: 45px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>🌤️ Weather App</h1>

        <input type="text" id="city" placeholder="Enter city">

        <button onclick="getWeather()">Search</button>

        <div id="weather"></div>

    </div>

    <script>
        function getWeather() {

            let city = document.getElementById("city").value;

            if (city === "") {
                alert("Please enter a city");
                return;
            }

            document.getElementById("weather").innerHTML = `
                <h2>${city}</h2>
                <div class="temperature">28°C</div>
                <p>☀️ Sunny</p>
                <p>Humidity: 55%</p>
                <p>Feels like: 30°C</p>
            `;
        }
    </script>

</body>
</html>
